# Free API Hub — 聊天实例配置
# 通用对话 / 轻量任务
# 优先使用国内免费提供商，海外 OpenRouter 兜底

gateway:
  port: 5080
  retry_seconds: 15       # 熔断器 OPEN→HALF_OPEN 恢复超时(秒)
  failure_threshold: 3    # 连续失败次数阈值，达到后熔断
  timeout: 30
  log: data/chat.log
  # 智能路由（ADR-008/009）：叠加式，不影响既有 failover；hide_raw=false 保留裸模型名
  routing:
    enabled: true
    default_strategy: priority
    hide_raw: false
    # ADR-010 manual_override：钉死单 provider（provider名/裸模型ID/alias名），空=不启用
    manual_override: ""            # 例：chat.yaml 手动指定 openrouter 时填 "openrouter"
    aliases:
      - name: fah/chat-free
        tags: [chat]
        strategy: capability
      - name: fah/light
        tags: [lightweight]
        strategy: priority

providers:
  - name: zhipu
    display: 智谱 GLM-4.5-Flash (免费)
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.5-flash
    priority: 1
    api_key: ${ZHIPU_API_KEY}
    capabilities:
      context_window: 128000
      output_limit: 4096
      supports_tools: true
      tags: [chat]

  - name: siliconflow
    display: SiliconFlow DeepSeek (免费)
    endpoint: https://api.siliconflow.cn/v1
    model: deepseek-ai/DeepSeek-V3.2
    priority: 2
    api_key: ${SILICONFLOW_API_KEY}
    capabilities:
      context_window: 128000
      output_limit: 4096
      supports_tools: true
      tags: [chat, lightweight]

  - name: siliconflow-r1
    display: SiliconFlow DeepSeek-R1-Qwen3-8B (免费·轻量)
    endpoint: https://api.siliconflow.cn/v1
    model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
    priority: 3
    api_key: ${SILICONFLOW_API_KEY}
    capabilities:
      context_window: 128000
      output_limit: 8192
      supports_tools: false
      tags: [chat, lightweight]

  - name: openrouter
    display: OpenRouter DeepSeek V4-Flash (低价兜底)
    endpoint: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash-latest
    priority: 9
    api_key: ${OPENROUTER_API_KEY}
    capabilities:
      context_window: 1310720
      output_limit: 4096
      supports_tools: true
      tags: [chat]
    headers:
      HTTP-Referer: http://localhost:5080
      X-Title: Free-API-Hub
