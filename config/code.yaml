# Free API Hub — 编程实例配置
# 代码生成 / 编程辅助

gateway:
  port: 5081
  retry_seconds: 5        # 熔断器 OPEN→HALF_OPEN 恢复超时(秒)
  failure_threshold: 3    # 连续失败次数阈值，达到后熔断
  timeout: 15
  log: data/code.log
  # 智能路由（ADR-008/009）：叠加式，不影响既有 failover；hide_raw=false 保留裸模型名
  routing:
    enabled: true
    default_strategy: priority
    hide_raw: false
    # ADR-010 manual_override：钉死单 provider（provider名/裸模型ID/alias名），空=不启用
    manual_override: ""              # 例：code.yaml 手动指定 DeepSeek 时填 "openrouter"
    aliases:
      - name: fah/code-x
        tags: [code]
        strategy: capability

providers:
  - name: deepseek-code
    display: DeepSeek V4 Flash
    endpoint: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    priority: 1
    api_key: ${DEEPSEEK_API_KEY}
    capabilities:
      context_window: 64000
      output_limit: 4096
      supports_tools: true
      tags: [code]

  - name: zhipu-code
    display: 智谱 GLM-4.7
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.7
    priority: 2
    api_key: ${ZHIPU_API_KEY}
    capabilities:
      context_window: 128000
      output_limit: 4096
      supports_tools: true
      tags: [code, chat]

  - name: openrouter-free
    display: OpenRouter Free Router
    endpoint: https://openrouter.ai/api/v1
    model: openrouter/free
    priority: 3
    api_key: ${OPENROUTER_API_KEY}
    capabilities:
      context_window: 128000
      output_limit: 4096
      supports_tools: false
      tags: [code, chat, lightweight]
    headers:
      HTTP-Referer: http://localhost:5080
      X-Title: Free-API-Hub

  - name: volcengine-code
    display: 火山引擎 Doubao-Code
    endpoint: https://ark.cn-beijing.volces.com/api/v3
    model: ep-20260613101407-6vz7g
    priority: 4
    api_key: ${VOLCENGINE_API_KEY}
    capabilities:
      context_window: 32000
      output_limit: 4096
      supports_tools: false
      tags: [code]
