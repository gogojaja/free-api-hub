# Free API Hub — 编程实例配置
# 代码生成 / 编程辅助

gateway:
  port: 5081
  retry_seconds: 15
  timeout: 30
  log: data/code.log

providers:
  - name: openrouter
    display: DeepSeek V4 Flash Free
    endpoint: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash:free
    priority: 1
    api_key: OPENROUTER_API_KEY_REPLACED
    headers:
      HTTP-Referer: http://localhost:5080
      X-Title: Free-API-Hub

  - name: zhipu
    display: 智谱AI GLM-4
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-4-plus
    priority: 2
    api_key: ZHIPU_API_KEY_REPLACED

  - name: nemotron
    display: NVIDIA Nemotron 3 Ultra Free
    endpoint: https://openrouter.ai/api/v1
