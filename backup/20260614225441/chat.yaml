# Free API Hub — 聊天实例配置
# 通用对话 / 轻量任务
# 优先使用国内免费提供商，海外 OpenRouter 兜底

gateway:
  port: 5080
  retry_seconds: 15
  timeout: 30
  log: data/chat.log

providers:
  - name: zhipu
    display: 智谱 GLM-4.7
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.7
    priority: 1
    api_key: ZHIPU_API_KEY_REPLACED

  - name: zhipu-fast
    display: 智谱 GLM-4.5-Air (快速)
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.5-air
    priority: 2
    api_key: ZHIPU_API_KEY_REPLACED

  - name: openrouter
    display: OpenRouter Free (兜底)
    endpoint: https://openrouter.ai/api/v1
    model: openrouter/free
    priority: 3
    api_key: OPENROUTER_API_KEY_REPLACED
    headers:
      HTTP-Referer: http://localhost:5080
      X-Title: Free-API-Hub
