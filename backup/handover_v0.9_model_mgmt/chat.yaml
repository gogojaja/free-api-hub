gateway:
  port: 5080
  retry_seconds: 15
  failure_threshold: 3
  timeout: 30
  log: data/chat.log
  routing:
    enabled: true
    default_strategy: cost
    hide_raw: false
    manual_override: ''
    aliases:
    - name: fah/bailian
      tags:
      - bailian
      strategy: cost
    - name: fah/chat-free
      tags:
      - chat
      strategy: cost
    - name: fah/light
      tags:
      - lightweight
      strategy: priority
    schedule_enabled: false
    schedule:
      windows:
      - name: deepseek-offpeak-beijing-nights
        hours: 18-23,0-8
        boost:
        - openrouter
        default_order:
        - siliconflow
        - bailian
        - zhipu
        - siliconflow-r1
        - openrouter
