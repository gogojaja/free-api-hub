# Free API Hub — 编程实例配置
# 代码生成 / 编程辅助

gateway:
  port: 5081
  retry_seconds: 5
  timeout: 15
  log: data/code.log

providers:
  - name: deepseek-code
    display: DeepSeek V4 Flash
    endpoint: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    priority: 1
    api_key: DEEPSEEK_API_KEY_REPLACED

  - name: zhipu-code
    display: 智谱 GLM-4.7
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.7
    priority: 2
    api_key: ZHIPU_API_KEY_REPLACED

  - name: openrouter-free
    display: OpenRouter Free Router
    endpoint: https://openrouter.ai/api/v1
    model: openrouter/free
    priority: 3
    api_key: OPENROUTER_API_KEY_REPLACED
    headers:
      HTTP-Referer: http://localhost:5080
      X-Title: Free-API-Hub

  - name: volcengine-code
    display: 火山引擎 Doubao-Code
    endpoint: https://ark.cn-beijing.volces.com/api/v3
    model: ep-20260613101407-6vz7g
    priority: 4
    api_key: VOLCENGINE_API_KEY_REPLACED
